# Claude i GitHub: skriv @claude i ett ärende (issue) eller en pull request, så
# gör Claude ändringen och öppnar en pull request. Vercel ger varje pull request
# en egen förhandsvisningslänk.
#
# Kräver en gång per repo (npm run github:claude guidar dig):
#   1. Claudes GitHub-app: https://github.com/apps/claude
#   2. Hemligheten CLAUDE_CODE_OAUTH_TOKEN (från `claude setup-token`)
# Utan hemligheten hoppas jobbet över, så inget går sönder.
#
# Action:erna är låsta till en commit (SHA), eftersom en tagg som `v1` kan flyttas
# till annan kod som då skulle köras med repots hemlighet. Dependabot
# (.github/dependabot.yml) föreslår nya versioner som pull requests.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Claudes GitHub-app byter en OIDC-token mot sin egen token. Utan den här
      # raden går action:en inte att köra (se action:ens docs/faq.md).
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@e5812cd75691ca7bbfc57c0ecf4441db3a1ab7dd # v1.0.281
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(npm ci),Bash(npm run typecheck),Bash(npm run build),Bash(npm run sj:add *),Bash(npm run sj:list)"
